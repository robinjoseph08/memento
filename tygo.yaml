type_mappings:
  time.Time: "string /* RFC3339 */"
  time.Duration: "number /* nanoseconds */"

packages:
  - path: "github.com/robinjoseph08/memento/pkg/publishing"
    output_path: "app/types/generated/publishing.ts"
    include_files:
      - "types.go"
  - path: "github.com/robinjoseph08/memento/pkg/errcodes"
    output_path: "app/types/generated/errors.ts"
    include_files:
      - "types.go"
  - path: "github.com/robinjoseph08/memento/pkg/identity"
    output_path: "app/types/generated/identity.ts"
    include_files:
      - "types.go"
  - path: "github.com/robinjoseph08/memento/pkg/immich"
    output_path: "app/types/generated/immich.ts"
    include_files:
      - "types.go"
