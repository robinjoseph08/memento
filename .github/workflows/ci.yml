name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Go lint
            task: lint
          - name: Frontend lint
            task: lint:js
          - name: Contract checks
            task: contracts:check
          - name: Unit tests
            task: test
          - name: Frontend build
            task: build
          - name: Race tests
            task: test:race
          - name: Security fuzz tests
            task: test:fuzz
          - name: Browser tests
            task: test:browser
          - name: PostgreSQL integration tests
            task: test:integration
          - name: Immich contract
            task: test:immich-contract
          - name: Development Compose validation
            task: compose:validate
          - name: Production Compose validation
            task: compose:production:validate
          - name: Workflow validation
            task: workflow:validate
          - name: Caddy validation
            task: caddy:validate
          - name: Production topology
            task: test:production

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned tools
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          version: 2026.7.12
          install: true
          cache: true

      - name: Run ${{ matrix.name }}
        run: mise run ${{ matrix.task }}

  validate:
    name: validate
    if: ${{ always() }}
    needs: suite
    runs-on: ubuntu-24.04
    steps:
      - name: Require every validation task to pass
        env:
          SUITE_RESULT: ${{ needs.suite.result }}
        run: test "$SUITE_RESULT" = success
