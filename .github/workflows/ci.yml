name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go lint and tests
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/memento_test?sslmode=disable
    services:
      postgres:
        image: postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_DB: memento_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d memento_test"
          --health-interval 1s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise lint:go
      - run: mise test:race

  postgres14:
    name: PostgreSQL 14 compatibility tests
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/memento_test?sslmode=disable
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_DB: memento_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d memento_test"
          --health-interval 1s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise test:postgres14

  javascript:
    name: TypeScript lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile
      - run: mise tygo
      - run: mise lint:js
      - run: mise test:unit

  browsers:
    name: E2E tests
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/memento_test?sslmode=disable
    services:
      postgres:
        image: postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_DB: memento_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d memento_test"
          --health-interval 1s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile

      - name: Read Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $NF}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: browser-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-three-engines-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install browsers
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Install browser system dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium firefox webkit

      - run: mise test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  production:
    name: Docker smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_DB: memento
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d memento"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile
      - run: mise build
      - run: mise docker

      - name: Smoke test production image
        run: |
          image_name=$(node -p "require('./package.json').name")
          container=$(docker run --detach --network host \
            --env DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/memento?sslmode=disable \
            --env APP_ENV=test --env AUTH_MODE=fake \
            --env PUBLIC_URL=http://127.0.0.1:8080 \
            --env IMMICH_URL=http://127.0.0.1:1 \
            --env IMMICH_API_KEY=smoke-fixture-only-key \
            "$image_name:latest")
          trap 'docker rm --force "$container" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              docker logs "$container"
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/ >/dev/null
          curl --fail --silent http://127.0.0.1:8080/setup | grep --quiet '<div id="root"></div>'
          asset_status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/assets/missing.js)
          api_status=$(curl --silent --output /tmp/api-missing --write-out '%{http_code}' http://127.0.0.1:8080/api/missing)
          test "$asset_status" = 404
          test "$api_status" = 404
          grep --quiet 'not_found' /tmp/api-missing
