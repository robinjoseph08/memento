name: Mobile

# The Mobile App is its own package, so it is only checked when it changes.
# Its payload types are generated from Go, so those files count as well.
on:
  push:
    branches: [master]
    paths:
      - "mobile/**"
      - "pkg/**/types.go"
      - "mise.toml"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "pkg/**/types.go"
      - "mise.toml"
      - ".github/workflows/mobile.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mobile:
    name: Mobile lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: pnpm --dir mobile install --frozen-lockfile
      - run: mise lint:mobile
      - run: mise test:mobile
