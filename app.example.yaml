# Application configuration
#
# Copy this file to /config/app.yaml, or set CONFIG_FILE to another path.
# Every setting can also be set with its uppercase environment variable.
# Environment variables take precedence over this file.

# For local testing without Google, set APP_ENV=development and AUTH_MODE=fake.
# Env: APP_ENV. Defaults to production; also accepts development and test.
app_env: production

# Required. Google is the production provider.
# Fake sign-in is permitted only in development and test.
# Env: AUTH_MODE
auth_mode: google

# Required public Memento origin, with no subpath, credentials, query, or fragment.
# Google requires HTTPS except exact HTTP localhost in development or test.
# A trailing slash is accepted and removed.
# Google sign-in appends /api/identity/google/callback to this origin.
# Register that exact redirect URI on the Google Web application client.
# Env: PUBLIC_URL
public_url: https://memento.example.com

# Required when AUTH_MODE=google. See README.md#google-sign-in for console setup.
# Env: GOOGLE_CLIENT_ID
google_client_id: ""

# Keep this secret in an environment variable rather than a checked-in file.
# Env: GOOGLE_CLIENT_SECRET
google_client_secret: ""

# Required Immich instance base URL, NOT its /api endpoint.
# HTTP or HTTPS. A reverse-proxy base path such as https://host/photos is
# supported; Memento appends /api. No credentials, query, or fragment.
# A trailing slash is accepted and removed.
# Env: IMMICH_URL
immich_url: http://immich-server:2283

# Required least-privilege read-only Immich key. Prefer an environment variable.
# Env: IMMICH_API_KEY
immich_api_key: ""

# SMTP is optional and is not configured by this release.

# Required PostgreSQL connection URL, including an explicit role and database.
# Use a separate database and role from Immich, even in a shared container.
# Both postgres:// and postgresql:// are supported. Query parameters such as
# sslmode and search_path are passed through to the PostgreSQL driver.
# Env: DATABASE_URL
database_url: postgres://app:change-me@postgres:5432/memento?sslmode=disable

# Log SQL queries for contexts wrapped with database.WithLogging.
# Env: DATABASE_DEBUG
database_max_open_conns: 10
database_max_idle_conns: 3
database_debug: false

# Number of connection attempts during startup.
# Env: DATABASE_CONNECT_RETRY_COUNT
database_connect_retry_count: 5

# Delay between connection attempts.
# Env: DATABASE_CONNECT_RETRY_DELAY
database_connect_retry_delay: 2s

# Directory used for application-managed files.
# Env: FILES_PATH
files_path: /data/files

# HTTP listener address.
# Env: SERVER_HOST
server_host: 0.0.0.0

# HTTP listener port.
# Env: SERVER_PORT
server_port: 3579
