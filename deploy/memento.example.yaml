# Secrets are intentionally omitted. Supply database.url, immich.api_key,
# security.secret, smtp.password, push.private_key, and the one-time restore
# recovery nonce through their MEMENTO_* value or MEMENTO_*_FILE setting.
http:
  address: "127.0.0.1:8081"
  # Public origin used for personalized Invitation links in email.
  public_url: "https://memento.example.com"
  shutdown_timeout: 8s

database:
  name: memento
  max_open_conns: 10
  health_timeout: 2s

immich:
  url: http://immich:2283
  health_timeout: 2s

sources:
  # Stable Source album membership is reconciled by the durable worker.
  reconciliation_interval: 10m

geoip:
  # Optional MaxMind-compatible City database read locally at startup. No
  # request-time network lookup is performed.
  database_path: ""

# Generate at least 32 random bytes and keep this stable across restarts.
security:
  setup_rate_window: 15m
  setup_email_limit: 3
  setup_ip_limit: 20
  invitation_accept_rate_window: 15m
  invitation_accept_ip_limit: 20
  sign_in_rate_window: 15m
  sign_in_email_limit: 3
  sign_in_ip_limit: 10
  # Forwarded client IPs are accepted only from these explicit proxy networks.
  trusted_proxy_cidrs: "127.0.0.0/8,::1/128"

# Enable after replacing every address and SMTP endpoint. starttls requires the
# server to advertise STARTTLS and never downgrades to plaintext. implicit_tls
# is also supported. Insecure transport is development-only and is rejected
# unless explicitly enabled for a loopback or private IP address.
smtp:
  enabled: false
  host: smtp.example.com
  port: 587
  mode: starttls
  server_name: smtp.example.com
  username: memento
  from_address: memento@example.com
  test_recipient: operator@example.com
  insecure_development: false
  timeout: 10s
  retry_base: 30s
  retry_max: 1h
  retry_window: 24h

# Generate one stable VAPID P-256 pair with a Web Push tool. Put the matching
# unpadded base64url private key in MEMENTO_PUSH_PRIVATE_KEY_FILE. Rotating the
# pair requires every device to enroll again.
push:
  enabled: false
  public_key: ""
  subject: "mailto:operator@example.com"
  timeout: 10s
  retry_base: 30s
  retry_max: 1h
  retry_window: 24h
  ttl: 15m

worker:
  poll_interval: 1s
  heartbeat_interval: 2s
  heartbeat_max_age: 10s
  lease_duration: 30s
  drain_timeout: 5s
  retry_base: 1s
  retry_max: 1h
